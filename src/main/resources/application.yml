spring:
  application:
    name: backend

  datasource:
    url: jdbc:mysql://localhost:3306/wanderchina?connectionTimeZone=UTC&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: "123456"

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

  data:
    redis:
      # 景点排行榜缓存（change: add-spot-ranking-redis-cache）。本地默认 localhost:6379，
      # 生产用环境变量 REDIS_HOST / REDIS_PORT 覆盖；timeout/connect-timeout 收敛到亚秒级，
      # 保证 Redis 宕机时 fail-safe 直查数据库的最坏等待可控（Lettuce 默认命令超时长达 60s）。
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms

  # 真实 SMTP（生产必配，本地可选）：仅通过环境变量启用，本文件不写 mail 段。
  # 未设置 SPRING_MAIL_HOST 时不装配 JavaMailSender，SmtpMailSender 不生效，
  # 自动回退 LoggingMailSender（仅日志，无需凭据）——测试与默认本地开发均走此路径。
  # 手工验证 / 生产发信时设置（Spring 宽松绑定自动映射 spring.mail.*）：
  #   SPRING_MAIL_HOST=smtp.qq.com
  #   SPRING_MAIL_PORT=465
  #   SPRING_MAIL_USERNAME=<邮箱>
  #   SPRING_MAIL_PASSWORD=<QQ 授权码>
  #   SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true
  #   SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE=true
  # 凭据属敏感信息，禁止写进本文件或提交仓库。

  # 定时任务线程池（change: add-travel-services）。默认值是 1，而汇率 / 天气两个刷新任务
  # 会共用这个池：启动预热的天气任务最坏约 110s（11 城 × 2 端点 × 5s read timeout），
  # 池为 1 时 cron 触发的汇率任务只能排在它后面。给到 2，两个 job 各自可跑。
  task:
    scheduling:
      pool:
        size: 2

  # MCP Server（change: add-travel-services）。
  # !! 安全关键：默认值是 true，且默认 protocol=SSE —— 只要 starter 在 classpath 上，
  #    不写这行就会注册 /sse 与 /mcp/message 两个 HTTP 端点。故此处显式关闭。
  # 关闭不影响 @Tool 的用途：工具只需定义一次，同 JVM 内的 ChatClient 直接消费同一批
  # bean，零传输；HTTP 传输只有「进程外的 MCP 客户端」才需要。
  # 若将来要开，鉴权方案须单独评估：这些端点会落到 SecurityConfig 的
  # anyRequest().authenticated()（fail-closed，正确）。严禁为让 MCP 跑通而 permitAll()——
  # 那等于全互联网都能调工具、烧掉 OpenWeatherMap 配额。
  ai:
    mcp:
      server:
        enabled: false
        # 注解扫描器的开关是独立的（不受上面 enabled: false 约束），默认也是 true。
        # 它扫的是 mcp-annotations 的 @McpTool，本仓用的是 Spring AI 的 @Tool，两者不是同一个注解，
        # 所以扫描器对本仓无用；开着只会在每次启动打三条 BeanPostProcessorChecker WARN。
        annotation-scanner:
          enabled: false

server:
  port: 8080

app:
  cors:
    # 允许调用本服务的前端来源。生产环境必须显式列出，禁止使用 "*"
    allowed-origins:
      - http://localhost:3000
  # 前端站点地址，用于拼接邮件中的验证 / 重置链接
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  # 景点排行榜 Redis 缓存开关（默认开）。surefire 测试经系统属性 app.ranking-cache.enabled=false 关闭；
  # 生产可用此键作热停（kill switch）开关，不必回滚代码。
  ranking-cache:
    enabled: true

  # 旅行实用工具：汇率 + 天气（change: add-travel-services）
  travel:
    exchange-rate:
      # 功能开关。语义是「功能停用」而非 ranking-cache 的「绕过缓存但结果正确」：
      # 关闭后不出网、不刷新，读端点返回空数据。可作热停开关，不必回滚代码。
      enabled: true
      # 出网固定一张 base=CNY 的表，展示方向由前端取倒数——不按目标币种拆键、拆调用。
      base: CNY
      refresh-cron: "0 30 3 * * *"       # 每日 03:30（容器时区，部署为 Asia/Shanghai）
      # 软过期必须严格大于刷新周期（24h + 2h 余量）。取等或更小会让数据在每个周期末尾
      # 都被标成 stale，这个标记随即失去信噪比。
      soft-ttl: 26h
      hard-ttl: 7d                       # 超过则返回空数据；同时是 Redis key 的物理 TTL
    weather:
      enabled: true
      # 空值即哨兵：不装配外部客户端、不触发刷新、读端点天气字段返回 null
      # （同 spring.mail.host 未设时回退 LoggingMailSender 的套路）。
      # 凭据经环境变量注入，禁止写进本文件或提交仓库。
      api-key: ${OPENWEATHER_API_KEY:}
      refresh-cron: "0 0 */3 * * *"      # 每 3h：11 城 × 2 端点 × 8 轮 = 176 次/天
      lang: en                           # 上游 description 语言，显式给值以防上游改默认
      soft-ttl: 4h                       # > 3h 刷新周期，留 1h 余量
      hard-ttl: 24h
    client:
      # 全仓首个出网客户端。两个超时都显式设定：不设则 JDK 默认可能无限等待，
      # 一个挂住的上游会占满调度线程。
      connect-timeout: 2s
      read-timeout: 5s
    # 多实例抢主锁 TTL，上下两界都要满足：
    #   单轮任务最坏耗时(≈110s) < refresh-lock-ttl < 最短刷新周期(3h)
    # 小于下界则锁在任务跑完前过期、另一实例接着抢到，正是这把锁要防的事。
    refresh-lock-ttl: 5m

auth:
  jwt:
    # HS256 要求密钥 >= 32 字节；生产环境必须通过 JWT_SECRET 环境变量注入
    secret: ${JWT_SECRET:wanderchina-dev-jwt-secret-key-change-me-in-production-0123456789abcdef}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7

  bcrypt:
    strength: 10

  mail:
    # 验证码属一次性凭证，禁止写入日志（默认 false，生产安全）。
    # 本地调试需打印链接：用 dev profile 覆盖（application-dev.yml）或设 AUTH_MAIL_LOG_VERIFICATION_CODE=true
    log-verification-code: false

  # 状态机与锁定策略常量（见 openspec/specs/auth-module/spec.md）
  verification-code-ttl-hours: 24
  max-failed-attempts: 5
  lock-duration-minutes: 15

  rate-limit:
    login-per-ip-per-15m: 10
    login-per-ip-email-per-15m: 5
    register-per-ip-per-hour: 5
    resend-per-ip-per-hour: 10
    resend-per-ip-email-per-24h: 3
    # 忘记密码与重发验证取齐，避免两个语义相近的端点各自维护一套数字
    forgot-password-per-ip-per-hour: 10
    forgot-password-per-ip-email-per-24h: 3
    reset-password-per-ip-per-hour: 10
    # 投票：单用户每分钟（防刷票）。
    vote-per-user-per-minute: 10

# 私信（change: add-direct-messages）：发送限流复用 auth/ratelimit 的 RateLimiter 组件，
# 阈值由本模块自有配置承载（design.md：10 条/分钟起步，常量可配）。
messaging:
  rate-limit:
    send-per-user-per-minute: 10

# OpenAPI 文档产出（change: openapi-integration）
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 生产环境专属配置已迁移至 application-prod.yml（按 profile 自动加载，不在此重复）
