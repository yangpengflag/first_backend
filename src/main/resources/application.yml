spring:
  application:
    name: backend

  datasource:
    url: jdbc:mysql://localhost:3306/wanderchina?connectionTimeZone=UTC&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: "123456"

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

  data:
    redis:
      # 景点排行榜缓存（change: add-spot-ranking-redis-cache）。本地默认 localhost:6379，
      # 生产用环境变量 REDIS_HOST / REDIS_PORT 覆盖；timeout/connect-timeout 收敛到亚秒级，
      # 保证 Redis 宕机时 fail-safe 直查数据库的最坏等待可控（Lettuce 默认命令超时长达 60s）。
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms

  # 真实 SMTP（生产必配，本地可选）：仅通过环境变量启用，本文件不写 mail 段。
  # 未设置 SPRING_MAIL_HOST 时不装配 JavaMailSender，SmtpMailSender 不生效，
  # 自动回退 LoggingMailSender（仅日志，无需凭据）——测试与默认本地开发均走此路径。
  # 手工验证 / 生产发信时设置（Spring 宽松绑定自动映射 spring.mail.*）：
  #   SPRING_MAIL_HOST=smtp.qq.com
  #   SPRING_MAIL_PORT=465
  #   SPRING_MAIL_USERNAME=<邮箱>
  #   SPRING_MAIL_PASSWORD=<QQ 授权码>
  #   SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true
  #   SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE=true
  # 凭据属敏感信息，禁止写进本文件或提交仓库。
  # 也可覆盖连接/读写超时（默认下方 5s，覆盖方式同属 spring.mail.properties.* 宽松绑定）：
  #   SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT=5000
  #   SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT=5000
  #   SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT=5000
  mail:
    properties:
      mail:
        smtp:
          # SMTP 超时兜底：仅当显式配置 SPRING_MAIL_HOST 时才生效。
          # 防止不可达主机让注册/重发/忘记密码请求挂起数分钟（服务端已 fail-open，仍要限时）。
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # 定时任务线程池（change: add-travel-services）。默认值是 1，而汇率 / 天气两个刷新任务
  # 会共用这个池：启动预热的天气任务最坏约 110s（11 城 × 2 端点 × 5s read timeout），
  # 池为 1 时 cron 触发的汇率任务只能排在它后面。给到 2，两个 job 各自可跑。
  task:
    scheduling:
      pool:
        size: 2

  # MCP Server（change: add-travel-services）。
  # !! 安全关键：默认值是 true，且默认 protocol=SSE —— 只要 starter 在 classpath 上，
  #    不写这行就会注册 /sse 与 /mcp/message 两个 HTTP 端点。故此处显式关闭。
  # 关闭不影响 @Tool 的用途：工具只需定义一次，同 JVM 内的 ChatClient 直接消费同一批
  # bean，零传输；HTTP 传输只有「进程外的 MCP 客户端」才需要。
  # 若将来要开，鉴权方案须单独评估：这些端点会落到 SecurityConfig 的
  # anyRequest().authenticated()（fail-closed，正确）。严禁为让 MCP 跑通而 permitAll()——
  # 那等于全互联网都能调工具、烧掉 OpenWeatherMap 配额。
  ai:
    # 模型自动配置总开关（change: ai-chat-core，spike 1.1 实测）：openai starter 的
    # AudioSpeech 等 auto-config 在空 api-key 下直接抛 "OpenAI API key must be set"、
    # 导致 context 启动失败（fail-START）。本仓要求空 key 也能启动（fail-closed），
    # 故全部置 none 关闭自动装配，改由 AiChatConfig 在 key 非空时显式自装配 ChatModel。
    model:
      # spike 1.1 实测：六类模型 auto-config 空 key 全部 fail-START（含 Chat 的 openAiApi），
      # 故全部 none，改由 AiChatConfig 在 key 非空时自建 ChatModel/ChatClient。
      chat: none
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    mcp:
      server:
        enabled: false
        # 注解扫描器的开关是独立的（不受上面 enabled: false 约束），默认也是 true。
        # 它扫的是 mcp-annotations 的 @McpTool，本仓用的是 Spring AI 的 @Tool，两者不是同一个注解，
        # 所以扫描器对本仓无用；开着只会在每次启动打三条 BeanPostProcessorChecker WARN。
        annotation-scanner:
          enabled: false

    # Chat/Embedding 模型接入（change: ai-rag 切供）：阿里云 DashScope OpenAI 兼容端点
    # （compatible-mode）。spike 实证（2026-09-08）：/chat/completions（qwen-plus）、
    # /embeddings（text-embedding-v3，1024 维）、function calling（tools 参数）三条红线全绿。
    # 键名沿用 spring.ai.openai.*（spring-ai-starter-model-openai 的既有锚点前缀，AiChatConfig
    # 与后续 RAG 自装 embedding 均读此键位，重命名成本 > 收益）；值是 DashScope，勿与 OpenAI 混淆。
    # base-url 不带 /v1：spring-ai 的 OpenAiApi 会在其后自动追加 /v1，带 /v1 会拼出
    # /v1/v1/chat/completions（404 实测）——设到 compatible-mode 根即可得到
    # .../compatible-mode/v1/chat/completions 与 /embeddings。
    # api-key 仅经环境变量注入，空值 = 哨兵——auto-config 必须优雅跳过（fail-closed），
    # 未装配时对话端点返回显式降级而非 5xx/启动失败（见 design.md D2，spike 1.1 实测）。
    # 凭据属敏感信息，禁止写进本文件或提交仓库。
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: qwen-plus

server:
  port: 8080

app:
  cors:
    # 允许调用本服务的前端来源。生产环境必须显式列出，禁止使用 "*"
    allowed-origins:
      - http://localhost:3000
  # 前端站点地址，用于拼接邮件中的验证 / 重置链接
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  # 景点排行榜 Redis 缓存开关（默认开）。surefire 测试经系统属性 app.ranking-cache.enabled=false 关闭；
  # 生产可用此键作热停（kill switch）开关，不必回滚代码。
  ranking-cache:
    enabled: true

  # 旅行实用工具：汇率 + 天气（change: add-travel-services）
  travel:
    exchange-rate:
      # 功能开关。语义是「功能停用」而非 ranking-cache 的「绕过缓存但结果正确」：
      # 关闭后不出网、不刷新，读端点返回空数据。可作热停开关，不必回滚代码。
      enabled: true
      # 出网固定一张 base=CNY 的表，展示方向由前端取倒数——不按目标币种拆键、拆调用。
      base: CNY
      refresh-cron: "0 30 3 * * *"       # 每日 03:30（容器时区，部署为 Asia/Shanghai）
      # 软过期必须严格大于刷新周期（24h + 2h 余量）。取等或更小会让数据在每个周期末尾
      # 都被标成 stale，这个标记随即失去信噪比。
      soft-ttl: 26h
      hard-ttl: 7d                       # 超过则返回空数据；同时是 Redis key 的物理 TTL
    weather:
      enabled: true
      # 空值即哨兵：不装配外部客户端、不触发刷新、读端点天气字段返回 null
      # （同 spring.mail.host 未设时回退 LoggingMailSender 的套路）。
      # 凭据经环境变量注入，禁止写进本文件或提交仓库。
      api-key: ${OPENWEATHER_API_KEY:}
      refresh-cron: "0 0 */3 * * *"      # 每 3h：11 城 × 2 端点 × 8 轮 = 176 次/天
      lang: en                           # 上游 description 语言，显式给值以防上游改默认
      soft-ttl: 4h                       # > 3h 刷新周期，留 1h 余量
      hard-ttl: 24h
    client:
      # 全仓首个出网客户端。两个超时都显式设定：不设则 JDK 默认可能无限等待，
      # 一个挂住的上游会占满调度线程。
      connect-timeout: 2s
      read-timeout: 5s
    # 多实例抢主锁 TTL，上下两界都要满足：
    #   单轮任务最坏耗时(≈110s) < refresh-lock-ttl < 最短刷新周期(3h)
    # 小于下界则锁在任务跑完前过期、另一实例接着抢到，正是这把锁要防的事。
    refresh-lock-ttl: 5m

  # AI 行程助手（change: ai-chat-core）。语义与 travel 各 feature 开关一致：
  # enabled=false 是「功能停用」kill switch（对话端点恒降级），无需回滚代码。
  # 装配与否还取决于 spring.ai.openai.api-key 是否非空（双条件）。
  ai-chat:
    enabled: true
    # 上下文窗口：每次生成载入会话最近 N 条消息（含本轮 user 消息），控制 token 预算
    context-window: 20
    # 匿名会话保留天数：超过则清理任务删除会话及其消息，防 DB 无限膨胀
    retention-days: 30
    # 游客免登录端点防滥用：IP 与会话双维度滑动窗口（复用 auth.ratelimit.RateLimiter）
    rate-limit:
      per-ip-per-minute: 10
      per-session-per-minute: 20

  # 写作辅助（change: ai-post-assist）。复用 app.ai-chat.enabled 作 AI 总开关（不新增哨兵）。
  # 仅承载「辅助」相关的输入上限 / 限流 / 超时；超时只约束 assist 的同步 RestClient，
  # 不影响 SSE 对话（对话上界已由 controller 的 90s/120s 承担）。
  ai-assist:
    # title / tags 的 content 截断上限：超出只损失建议质量，不损失数据（不拒绝）
    max-input-chars: 12000
    # polish 的 content 拒绝阈值：超出直接 422 拒绝、绝不截断（截断等同静默删稿）
    polish-max-chars: 8000
    # 标题裁剪上限，对齐 Post.title
    title-max-chars: 200
    # 双维限流（IP 维 + 用户维），复用 auth.ratelimit.RateLimiter 的滑动窗口
    rate-limit:
      per-ip-per-minute: 20
      per-user-per-minute: 10
    # 同步 RestClient 超时（仅 assist 同步调用生效）
    timeout:
      connect-ms: 5000
      read-ms: 30000

  # AI 助手 RAG 知识库（change: ai-rag，向量库现为 Milvus）。叠加能力：enabled=false = 停用 kill switch
  # （对话照常、无知识注入）；装配还取决于 DashScope api-key 非空（与 ai-chat 同 key）。
  # Milvus Standalone 为进程外向量库（gRPC :19530，本地需起服：docker compose up -d，
  # etcd + minio + milvus 三件套见根仓 docker-compose.yml）；宕机只降级（无知识注入），不崩不悬挂（惰性句柄）。
  ai-rag:
    enabled: true
    milvus-host: ${MILVUS_HOST:localhost}
    milvus-port: ${MILVUS_PORT:19530}
    # 集合维度必须与 embedding 模型绑定：DashScope text-embedding-v3 = 1024 维。
    # Milvus 建集合时 schema 固定，缺省会走客户端 1536 兜底建错——不得删除此键。
    embedding-dimension: 1024
    collection-name: wanderchina_knowledge
    # 每轮检索取相似度最高 top-k 条；min-score 默认 0：语料百篇级不设阈值
    # （低相似度靠模型判断过滤），避免阈值误杀召回
    top-k: 4
    min-score: 0.0
    # 单块字符上限（切块器用）；知识注入上界 ≈ chunk-max-chars × top-k（~5KB）
    chunk-max-chars: 1200
    # 知识库重建周期：每日 05:00（错开 chat 清理 04:30 的批次窗口）。多实例用 Redis 锁串行
    refresh-cron: "0 0 5 * * *"
    # 重建锁 TTL：单轮重建最坏耗时 << 周期（24h）
    refresh-lock-ttl: 5m

auth:
  jwt:
    # HS256 要求密钥 >= 32 字节；生产环境必须通过 JWT_SECRET 环境变量注入
    secret: ${JWT_SECRET:wanderchina-dev-jwt-secret-key-change-me-in-production-0123456789abcdef}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7

  bcrypt:
    strength: 10

  mail:
    # 验证码属一次性凭证，禁止写入日志（默认 false，生产安全）。
    # 本地调试需打印链接：用 dev profile 覆盖（application-dev.yml）或设 AUTH_MAIL_LOG_VERIFICATION_CODE=true
    log-verification-code: false

  # 状态机与锁定策略常量（见 openspec/specs/auth-module/spec.md）
  verification-code-ttl-hours: 24
  max-failed-attempts: 5
  lock-duration-minutes: 15

  rate-limit:
    login-per-ip-per-15m: 10
    login-per-ip-email-per-15m: 5
    register-per-ip-per-hour: 5
    resend-per-ip-per-hour: 10
    resend-per-ip-email-per-24h: 3
    # 忘记密码与重发验证取齐，避免两个语义相近的端点各自维护一套数字
    forgot-password-per-ip-per-hour: 10
    forgot-password-per-ip-email-per-24h: 3
    reset-password-per-ip-per-hour: 10
    # 投票：单用户每分钟（防刷票）。
    vote-per-user-per-minute: 10

# 私信（change: add-direct-messages）：发送限流复用 auth/ratelimit 的 RateLimiter 组件，
# 阈值由本模块自有配置承载（design.md：10 条/分钟起步，常量可配）。
messaging:
  rate-limit:
    send-per-user-per-minute: 10

# OpenAPI 文档产出（change: openapi-integration）
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 生产环境专属配置已迁移至 application-prod.yml（按 profile 自动加载，不在此重复）
