spring:
  application:
    name: backend

  datasource:
    url: jdbc:mysql://localhost:3306/wanderchina?connectionTimeZone=UTC&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: "123456"

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

  data:
    redis:
      # 景点排行榜缓存（change: add-spot-ranking-redis-cache）。本地默认 localhost:6379，
      # 生产用环境变量 REDIS_HOST / REDIS_PORT 覆盖；timeout/connect-timeout 收敛到亚秒级，
      # 保证 Redis 宕机时 fail-safe 直查数据库的最坏等待可控（Lettuce 默认命令超时长达 60s）。
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms

  # 真实 SMTP（生产必配，本地可选）：仅通过环境变量启用，本文件不写 mail 段。
  # 未设置 SPRING_MAIL_HOST 时不装配 JavaMailSender，SmtpMailSender 不生效，
  # 自动回退 LoggingMailSender（仅日志，无需凭据）——测试与默认本地开发均走此路径。
  # 手工验证 / 生产发信时设置（Spring 宽松绑定自动映射 spring.mail.*）：
  #   SPRING_MAIL_HOST=smtp.qq.com
  #   SPRING_MAIL_PORT=465
  #   SPRING_MAIL_USERNAME=<邮箱>
  #   SPRING_MAIL_PASSWORD=<QQ 授权码>
  #   SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true
  #   SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE=true
  # 凭据属敏感信息，禁止写进本文件或提交仓库。

server:
  port: 8080

app:
  cors:
    # 允许调用本服务的前端来源。生产环境必须显式列出，禁止使用 "*"
    allowed-origins:
      - http://localhost:3000
  # 前端站点地址，用于拼接邮件中的验证 / 重置链接
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  # 景点排行榜 Redis 缓存开关（默认开）。surefire 测试经系统属性 app.ranking-cache.enabled=false 关闭；
  # 生产可用此键作热停（kill switch）开关，不必回滚代码。
  ranking-cache:
    enabled: true

auth:
  jwt:
    # HS256 要求密钥 >= 32 字节；生产环境必须通过 JWT_SECRET 环境变量注入
    secret: ${JWT_SECRET:wanderchina-dev-jwt-secret-key-change-me-in-production-0123456789abcdef}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7

  bcrypt:
    strength: 10

  mail:
    # 验证码属一次性凭证，禁止写入日志（默认 false，生产安全）。
    # 本地调试需打印链接：用 dev profile 覆盖（application-dev.yml）或设 AUTH_MAIL_LOG_VERIFICATION_CODE=true
    log-verification-code: false

  # 状态机与锁定策略常量（见 openspec/specs/auth-module/spec.md）
  verification-code-ttl-hours: 24
  max-failed-attempts: 5
  lock-duration-minutes: 15

  rate-limit:
    login-per-ip-per-15m: 10
    login-per-ip-email-per-15m: 5
    register-per-ip-per-hour: 5
    resend-per-ip-per-hour: 10
    resend-per-ip-email-per-24h: 3
    # 忘记密码与重发验证取齐，避免两个语义相近的端点各自维护一套数字
    forgot-password-per-ip-per-hour: 10
    forgot-password-per-ip-email-per-24h: 3
    reset-password-per-ip-per-hour: 10
    # 投票：单用户每分钟（防刷票）。
    vote-per-user-per-minute: 10

# OpenAPI 文档产出（change: openapi-integration）
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 生产环境专属配置已迁移至 application-prod.yml（按 profile 自动加载，不在此重复）
